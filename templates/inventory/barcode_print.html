<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Barcode {{ variant.sku }}</title>

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        @page {
            size: 50mm 30mm;
            margin: 0;
        }

        html,
        body {
            width: 50mm;
            height: 30mm;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #fff;
            color: #000;
            font-family: Arial, Helvetica, sans-serif;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        body {
            position: relative;
        }

        .label {
            position: fixed;
            inset: 0;

            width: 50mm;
            height: 30mm;

            margin: 0;
            padding: 0;

            overflow: hidden;
            background: #fff;
        }

        .label-content {
            position: absolute;
            top: 50%;
            left: 50%;

            width: 43mm;
            height: 22mm;

            transform: translate(-50%, -50%);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 0.5mm;
            overflow: hidden;

            text-align: center;
        }

        .label-name {
            width: 100%;
            overflow: hidden;

            color: #000;
            font-size: 7.8px;
            line-height: 1.05;
            font-weight: 900;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .label-info {
            width: 100%;
            overflow: hidden;

            color: #000;
            font-size: 6px;
            line-height: 1.05;
            font-weight: 700;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .barcode-img {
            display: block;

            width: 38mm;
            height: 8.5mm;

            margin: 0;

            object-fit: fill;
        }

        .label-bottom {
            width: 38mm;

            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;

            gap: 1mm;
        }

        .sku {
            min-width: 0;
            overflow: hidden;

            color: #000;
            font-size: 6px;
            line-height: 1;
            font-weight: 900;
            text-align: left;

            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .price {
            color: #000;
            font-size: 7.5px;
            line-height: 1;
            font-weight: 900;
            text-align: right;
            white-space: nowrap;
        }

        .screen-controls {
            position: fixed;
            right: 10px;
            bottom: 10px;
            z-index: 1000;

            display: flex;
            gap: 8px;
        }

        .screen-controls button {
            min-height: 40px;
            padding: 0 14px;

            border: 0;
            border-radius: 9px;

            font-size: 12px;
            font-weight: 800;

            cursor: pointer;
        }

        .print-button {
            color: #fff;
            background: #7654dd;
        }

        .close-button {
            color: #333;
            background: #eee;
        }

        @media print {
            @page {
                size: 50mm 30mm;
                margin: 0;
            }

            html,
            body {
                width: 50mm !important;
                height: 30mm !important;

                margin: 0 !important;
                padding: 0 !important;

                overflow: hidden !important;
                background: #fff !important;
            }

            .label {
                position: fixed !important;
                inset: 0 !important;

                width: 50mm !important;
                height: 30mm !important;

                margin: 0 !important;
                padding: 0 !important;

                border: 0 !important;
                box-shadow: none !important;

                overflow: hidden !important;
                transform: none !important;

                page-break-before: avoid !important;
                page-break-after: avoid !important;
                page-break-inside: avoid !important;

                break-before: avoid !important;
                break-after: avoid !important;
                break-inside: avoid !important;
            }

            .label-content {
                position: absolute !important;
                top: 50% !important;
                left: 50% !important;

                width: 43mm !important;
                height: 22mm !important;

                transform: translate(-50%, -50%) !important;
            }

            .screen-controls {
                display: none !important;
            }
        }
    </style>
</head>

<body>
    <div class="label">
        <div class="label-content">
            <div class="label-name">
                {{ item.name }}
            </div>

            <div class="label-info">
                {{ variant.display_name }}
            </div>

            <img
                id="barcodeImage"
                class="barcode-img"
                src="data:image/png;base64,{{ barcode_base64 }}"
                alt="Barcode"
            >

            <div class="label-bottom">
                <div class="sku">
                    {{ variant.sku }}
                </div>

                <div class="price">
                    ${{ variant.sale_price|floatformat:2 }}
                </div>
            </div>
        </div>
    </div>

    <div class="screen-controls">
        <button
            type="button"
            class="close-button"
            onclick="window.close()"
        >
            Close
        </button>

        <button
            type="button"
            class="print-button"
            onclick="window.print()"
        >
            Print
        </button>
    </div>

    <script>
        function openPrintDialog() {
            window.setTimeout(function () {
                window.print();
            }, 300);
        }

        window.addEventListener("load", function () {
            const barcodeImage = document.getElementById("barcodeImage");

            if (barcodeImage && !barcodeImage.complete) {
                barcodeImage.addEventListener(
                    "load",
                    openPrintDialog,
                    { once: true }
                );

                barcodeImage.addEventListener(
                    "error",
                    openPrintDialog,
                    { once: true }
                );

                return;
            }

            openPrintDialog();
        });
    </script>
</body>
</html>
